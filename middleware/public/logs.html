<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Integration Logs — Tamkeen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0b1010;
        --panel: #121a1a;
        --ink: #d8e6e2;
        --muted: #7f9590;
        --line: rgba(216, 230, 226, 0.12);
        --accent: #c4a35a;
        --request: #6eb5ff;
        --response: #3d9a6a;
        --error: #e06c5c;
        --retry: #c4a35a;
        --event: #a78bfa;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "DM Sans", system-ui, sans-serif;
        color: var(--ink);
        background: radial-gradient(900px 500px at 0% 0%, #1a2e28 0%, transparent 55%),
          var(--bg);
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        justify-content: space-between;
        padding: 0.9rem 1.1rem;
        border-bottom: 1px solid var(--line);
        background: rgba(18, 26, 26, 0.9);
        position: sticky;
        top: 0;
        z-index: 5;
        backdrop-filter: blur(8px);
      }
      h1 {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .sub { color: var(--muted); font-size: 0.8rem; margin: 0.15rem 0 0; }
      a.link { color: var(--accent); text-decoration: none; }
      a.link:hover { text-decoration: underline; }
      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
      }
      input[type="text"] {
        background: var(--panel);
        border: 1px solid var(--line);
        color: var(--ink);
        border-radius: 8px;
        padding: 0.4rem 0.65rem;
        min-width: 200px;
        font: inherit;
      }
      button, .tab {
        font: inherit;
        cursor: pointer;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        padding: 0.4rem 0.7rem;
      }
      button.active, .tab.active {
        border-color: var(--accent);
        color: var(--accent);
      }
      button:hover, .tab:hover { border-color: var(--muted); }
      .tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        padding: 0.75rem 1.1rem 0.4rem;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--error);
      }
      .dot.on { background: var(--response); }
      main {
        padding: 0.5rem 1.1rem 1.5rem;
      }
      #logView {
        background: #070b0b;
        border: 1px solid var(--line);
        border-radius: 12px;
        min-height: 70vh;
        max-height: calc(100vh - 160px);
        overflow: auto;
        padding: 0.75rem 0.9rem;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.78rem;
        line-height: 1.45;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .entry {
        margin: 0 0 0.85rem;
        padding-bottom: 0.55rem;
        border-bottom: 1px dashed rgba(216, 230, 226, 0.08);
      }
      .entry.request { border-left: 3px solid var(--request); padding-left: 0.6rem; }
      .entry.response { border-left: 3px solid var(--response); padding-left: 0.6rem; }
      .entry.error { border-left: 3px solid var(--error); padding-left: 0.6rem; color: #f0b4ac; }
      .entry.retry { border-left: 3px solid var(--retry); padding-left: 0.6rem; color: #e6d3a0; }
      .entry.event { border-left: 3px solid var(--event); padding-left: 0.6rem; }
      .empty {
        color: var(--muted);
        padding: 2rem 0.5rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Integration Logs</h1>
        <p class="sub">
          Live stream from Nest ·
          <a class="link" href="./console.html">Demo console</a> ·
          files under <code>middleware/logs/</code>
        </p>
      </div>
      <div class="controls">
        <span class="status"><span class="dot" id="connDot"></span><span id="connLabel">Disconnected</span></span>
        <input id="filter" type="text" placeholder="Filter text…" />
        <button type="button" id="btnPause">Pause</button>
        <button type="button" id="btnAutoscroll" class="active">Auto-scroll</button>
        <button type="button" id="btnClear">Clear</button>
      </div>
    </header>
    <div class="tabs" id="tabs"></div>
    <main>
      <div id="logView"><div class="empty">Connecting to /logs…</div></div>
    </main>
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="./logs.js"></script>
  </body>
</html>
